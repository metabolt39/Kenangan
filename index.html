<style>
/* Susun atur: satu lajur sempit macam suapan telefon. Atas: sapaan dan Kenangan Hari Ini. Tengah: kad album bertindih, peta memori, suapan. Tab bawah: Utama, Galeri, Peta. Butang Tambah emas terapung. */
:root{
  --bg:#FAF5EA;
  --surface:#FFFDF8;
  --surface-2:#F1E9D9;
  --ink:#2D2A26;
  --ink-2:#6F675C;
  --line:#E8DDC9;
  --gold:#E2A93B;
  --gold-ink:#8A5A00;
  --teal:#3F8A7C;
  --teal-soft:#DCEBE4;
  --coral:#EE7B5E;
  --coral-soft:#FCE4DB;
  --accent:#2F7F73;
  --accent-ink:#FFFFFF;
  --accent-soft:#D9ECE6;
  --heart:#E4573D;
  --sticky:#FFEFA8;
  --sticky-ink:#3D3000;
  --scrim:rgba(20,14,8,.58);
  --lb-bg:#0B0D12;
  --lb-ink:#F4F0E8;
  --shadow:0 1px 2px rgba(80,60,20,.08),0 14px 30px -18px rgba(80,60,20,.4);
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-serif:'Lora',Georgia,serif;
  --font-script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A29; --surface:#1B2436; --surface-2:#26324A; --ink:#F2EEE6; --ink-2:#A9B2C3; --line:#2E3A52;
    --gold:#F0BC52; --gold-ink:#F0BC52; --teal:#7CC4B3; --teal-soft:#1F3C41; --coral:#FF9A7E; --coral-soft:#3A2B33;
    --accent:#7CC4B3; --accent-ink:#0C2A25; --accent-soft:#1F3C41; --heart:#FF8B7B;
    --scrim:rgba(0,0,0,.66); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A29; --surface:#1B2436; --surface-2:#26324A; --ink:#F2EEE6; --ink-2:#A9B2C3; --line:#2E3A52;
  --gold:#F0BC52; --gold-ink:#F0BC52; --teal:#7CC4B3; --teal-soft:#1F3C41; --coral:#FF9A7E; --coral-soft:#3A2B33;
  --accent:#7CC4B3; --accent-ink:#0C2A25; --accent-soft:#1F3C41; --heart:#FF8B7B;
  --scrim:rgba(0,0,0,.66); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root[data-skin="pantai"]:not([data-theme="dark"]){--bg:#F2F8FB;--surface:#FFFFFF;--surface-2:#E1EEF4;--line:#D0E3EC;--teal:#1E8FB0;--teal-soft:#D3ECF5;--accent:#1B7FA0;--accent-soft:#D3ECF5;--gold:#F2B544;--coral:#FF8A6B;--coral-soft:#FFE3DA;}}
:root[data-skin="pantai"][data-theme="light"]{--bg:#F2F8FB;--surface:#FFFFFF;--surface-2:#E1EEF4;--line:#D0E3EC;--teal:#1E8FB0;--teal-soft:#D3ECF5;--accent:#1B7FA0;--accent-soft:#D3ECF5;--gold:#F2B544;--coral:#FF8A6B;--coral-soft:#FFE3DA;}
@media (prefers-color-scheme: dark){:root[data-skin="pantai"]:not([data-theme="light"]){--accent:#6CC3E0;--teal:#6CC3E0;--teal-soft:#1B3A4A;--accent-soft:#1B3A4A;--accent-ink:#06222D;}}
:root[data-skin="pantai"][data-theme="dark"]{--accent:#6CC3E0;--teal:#6CC3E0;--teal-soft:#1B3A4A;--accent-soft:#1B3A4A;--accent-ink:#06222D;}
@media (prefers-color-scheme: light){:root[data-skin="raya"]:not([data-theme="dark"]){--bg:#F4F1E3;--surface:#FFFEF8;--surface-2:#E5E8D0;--line:#D8DBBC;--teal:#1F6F4A;--teal-soft:#D6EAD9;--accent:#1F6F4A;--accent-soft:#D6EAD9;--gold:#C9962B;--gold-ink:#7A5600;--coral:#C8553D;--coral-soft:#F7E0D6;}}
:root[data-skin="raya"][data-theme="light"]{--bg:#F4F1E3;--surface:#FFFEF8;--surface-2:#E5E8D0;--line:#D8DBBC;--teal:#1F6F4A;--teal-soft:#D6EAD9;--accent:#1F6F4A;--accent-soft:#D6EAD9;--gold:#C9962B;--gold-ink:#7A5600;--coral:#C8553D;--coral-soft:#F7E0D6;}
@media (prefers-color-scheme: dark){:root[data-skin="raya"]:not([data-theme="light"]){--accent:#7FD1A0;--teal:#7FD1A0;--teal-soft:#1D3A2E;--accent-soft:#1D3A2E;--accent-ink:#0A2518;}}
:root[data-skin="raya"][data-theme="dark"]{--accent:#7FD1A0;--teal:#7FD1A0;--teal-soft:#1D3A2E;--accent-soft:#1D3A2E;--accent-ink:#0A2518;}
@media (prefers-color-scheme: light){:root[data-skin="senja"]:not([data-theme="dark"]){--bg:#FBF2F0;--surface:#FFFDFC;--surface-2:#F2E3E5;--line:#EAD3D7;--teal:#7B5EA7;--teal-soft:#E5DCF1;--accent:#6E4F9F;--accent-soft:#E5DCF1;--gold:#F0A64B;--gold-ink:#8A4B00;--coral:#E8607A;--coral-soft:#FDE0E6;}}
:root[data-skin="senja"][data-theme="light"]{--bg:#FBF2F0;--surface:#FFFDFC;--surface-2:#F2E3E5;--line:#EAD3D7;--teal:#7B5EA7;--teal-soft:#E5DCF1;--accent:#6E4F9F;--accent-soft:#E5DCF1;--gold:#F0A64B;--gold-ink:#8A4B00;--coral:#E8607A;--coral-soft:#FDE0E6;}
@media (prefers-color-scheme: dark){:root[data-skin="senja"]:not([data-theme="light"]){--accent:#B79CE6;--teal:#B79CE6;--teal-soft:#33284A;--accent-soft:#33284A;--accent-ink:#1E1236;}}
:root[data-skin="senja"][data-theme="dark"]{--accent:#B79CE6;--teal:#B79CE6;--teal-soft:#33284A;--accent-soft:#33284A;--accent-ink:#1E1236;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root[data-big="1"] body{zoom:1.2}
:root[data-big="2"] body{zoom:1.4}
body{
  margin:0;background:radial-gradient(80% 30% at 100% 0%,rgba(226,169,59,.16),transparent 70%),radial-gradient(70% 30% at 0% 12%,rgba(238,123,94,.10),transparent 70%),var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.5;padding-block:0 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kepala */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:10px 0;margin-inline:-8px;padding-inline:8px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{flex:1;min-width:0;margin:0;font:700 clamp(18px,5vw,22px)/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.rnd{border:1px solid var(--line);border-radius:50%;background:var(--surface);width:42px;height:42px}
.me{flex:none;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.me:hover{filter:brightness(1.05)}
.top{padding-block:6px 4px}
.hi{margin:0;display:flex;align-items:center;gap:8px;font:italic 600 clamp(19px,5.4vw,24px)/1.2 var(--font-display);color:var(--gold-ink);letter-spacing:.01em}
.sky{width:38px;height:38px;flex:none;display:block;overflow:visible}
.wx{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.wx b{color:var(--ink)}
.cityf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:340px}
.cityf input{flex:1;min-width:0;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:15px}
.cityf .btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:99px}
.wxrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.wxrow .wx{margin-top:0}
.wxrow .lnk{font-size:13px;padding:4px 0}
.mood{display:none;margin:6px 0 0;font:italic 400 15px/1.45 var(--font-serif);color:var(--ink-2);text-wrap:balance;max-width:34ch}
.skins{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.skins::-webkit-scrollbar{display:none}
.skin{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.skin i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.memw{position:relative;margin-top:14px}
.memw .mem{margin-top:0}
.shuf{position:absolute;z-index:2;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:rgba(255,253,248,.88);color:#2B1A06;font-weight:700;font-size:14px;backdrop-filter:blur(6px)}
.shuf .i{width:16px;height:16px}
.mapw{position:relative}
.route{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round;opacity:.85;animation:dash 1.6s linear infinite}
.pulse{fill:var(--coral);opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.mapdots{fill:var(--teal);opacity:.16}
.pop{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;width:max-content;max-width:70%;padding:8px 14px 8px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 30px -10px rgba(0,0,0,.45);animation:zin .25s ease-out}
.pop img{width:54px;height:54px;object-fit:cover;border:3px solid #fff;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:rotate(-5deg);flex:none;background:var(--surface-2)}
.pop b{display:block;font:700 15px/1.25 var(--font-display);overflow-wrap:anywhere}
.pop span{font-size:12px;color:var(--ink-2)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2.5%,-1.5%)}}
.spin{transform-origin:16px 16px;animation:spin 24s linear infinite}
.tw{animation:tw 2.4s ease-in-out infinite}
.drop{stroke:var(--teal);stroke-width:2;stroke-linecap:round;animation:dr 1s linear infinite}
.rain{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.rain i{position:absolute;top:-24px;width:2px;height:18px;border-radius:2px;background:linear-gradient(transparent,var(--teal));opacity:.5;animation:fall linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{50%{opacity:.25}}
@keyframes dr{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
@keyframes fall{to{transform:translateY(115vh)}}
@media (prefers-reduced-motion:reduce){.spin,.tw,.drop,.route,.pulse,.mem img{animation:none!important}.rain{display:none}}
.sub{margin:0;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.av{width:40px;height:40px;margin:2px;border-radius:50%;flex:none;display:block;background:var(--surface-2);object-fit:cover;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ring,var(--gold))}
.av.sm{width:30px;height:30px}
.av-fb{display:grid;place-items:center;font:700 15px var(--font-display);color:var(--ink-2)}

/* Kenangan Hari Ini */
.mem{position:relative;display:block;width:100%;margin-top:14px;padding:0;border:0;border-radius:26px;overflow:hidden;aspect-ratio:4/5;max-height:min(640px,80vh);color:#fff;text-align:left;background:var(--surface-2);box-shadow:var(--shadow)}
.mem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:kb 20s ease-in-out infinite alternate}
.mem::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,12,6,.86) 0%,rgba(18,12,6,.4) 46%,transparent 72%)}
.mem-t{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.mem-k{align-self:flex-start;font:700 11px var(--font-body);letter-spacing:.16em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:var(--gold);color:#2B1A06}
.mem-q{font:italic 500 clamp(23px,6.6vw,30px)/1.28 var(--font-display);text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.mem-m{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.92}
.mem-m .i{width:16px;height:16px}

/* Seksyen */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sec h2{margin:0;font:700 21px/1.2 var(--font-display)}
.lnk{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.sec select{min-height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}

/* Kad album */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acard{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;padding:16px 14px 16px;border:1px solid var(--line);border-radius:20px;text-align:left;background:var(--surface-2);background:linear-gradient(160deg,color-mix(in srgb,var(--tint,var(--surface-2)) 34%,var(--surface)),var(--surface));box-shadow:var(--shadow)}
.acard.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}
.acard .cover{display:block;width:96px;height:96px;flex:none;border-radius:14px;object-fit:cover;background:var(--surface-2)}
.stack{position:relative;display:block;height:108px;margin:4px 4px 0}
.stack i{position:absolute;display:block;width:76px;height:90px;padding:4px 4px 14px;background:#fff;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.28)}
.stack i img,.stack i b{display:block;width:100%;height:100%;object-fit:cover}
.stack i b{background:var(--surface-2)}
.stack i:nth-child(1){left:0;top:12px;transform:rotate(-8deg)}
.stack i:nth-child(2){left:28px;top:2px;transform:rotate(3deg);z-index:1}
.stack i:nth-child(3){left:56px;top:14px;transform:rotate(11deg);z-index:2}
.ac-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ac-t strong{font:700 17px/1.25 var(--font-display)}
.ac-t span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}

/* Peta */
.mapc{padding:12px 12px 10px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.mapsvg{display:block;width:100%;height:auto}
.land{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.2;stroke-linejoin:round}
.mlabel{font:600 7px var(--font-body);letter-spacing:.18em;fill:var(--ink-2);text-anchor:middle;text-transform:uppercase}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .ring{fill:var(--coral);opacity:.3}
.pin .dot{fill:var(--gold);stroke:var(--coral);stroke-width:2}
.pin.on .dot{stroke:var(--ink);stroke-width:2.5}
.pin text{font:700 8px var(--font-body);fill:#2B1A06;text-anchor:middle;pointer-events:none}
.set-me{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
.set-me .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.set-me .nm strong{font-size:17px;overflow-wrap:anywhere}
.set-me .nm span{font-size:13px;color:var(--ink-2)}
.set-h{margin:22px 0 10px;font:700 12px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-weight:600;font-size:14px;color:var(--ink)}
.tile i{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.segc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--surface-2)}
.segc button{min-height:46px;border:0;border-radius:12px;background:none;font-weight:600;color:var(--ink-2)}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.set-p{margin:0 0 10px;font-size:15px;color:var(--ink)}
.set-row{display:flex;flex-wrap:wrap;gap:8px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-item{display:flex;align-items:center;min-height:50px;width:100%;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;text-align:left;color:var(--ink)}
.setp .cityf{max-width:none;margin-top:12px}
.ugrid{display:block}
.hint{margin:6px 4px 0;font-size:13px;color:var(--ink-2)}
.pinp{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.pinp h3{margin:0 0 2px;font:700 19px/1.25 var(--font-display);overflow-wrap:anywhere}
.pinp .m{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pgrid button{padding:0;border:0;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.places{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.place{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.place-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;text-align:left;padding:0;min-height:60px}
.pt{width:58px;height:58px;border:3px solid #fff;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.28);object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);transform:rotate(-4deg)}

.pi{display:flex;flex-direction:column;min-width:0}
.pi strong{font:700 17px/1.25 var(--font-display);overflow-wrap:anywhere}
.pi span{font-size:13px;color:var(--ink-2)}
.map{font-size:13px;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* Penapis */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip .i{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:99px;background:var(--surface-2);margin-top:16px}
.seg button{min-height:38px;padding:0 18px;border:0;border-radius:99px;background:none;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ahead{display:flex;align-items:center;gap:14px;margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface-2);background:linear-gradient(135deg,color-mix(in srgb,var(--tint,var(--surface-2)) 48%,var(--surface)),color-mix(in srgb,var(--tint,var(--surface-2)) 12%,var(--surface)))}
.ahead .em{font-size:36px;line-height:1}
.ahead h2{margin:0;font:700 24px/1.2 var(--font-display);overflow-wrap:anywhere}
.ahead p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.ahead .grow{flex:1;min-width:0}
.sbar{display:flex;gap:8px;align-items:center;margin:6px 0 2px}
.sbar input{flex:1;min-width:0;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.sbar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag.evt{border:0;cursor:pointer;font-family:inherit;background:var(--coral-soft);color:var(--ink)}
.newb{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.nbanner{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--teal-soft)}
.nbanner span{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.35}
.evs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.evs::-webkit-scrollbar{display:none}
.ev{flex:none;width:148px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;text-align:left;padding:0}
.ev .evc{position:relative;display:block;height:96px;background:var(--surface-2);background:linear-gradient(135deg,color-mix(in srgb,var(--tint,var(--surface-2)) 55%,var(--surface)),var(--surface-2))}
.ev .evc img{width:100%;height:100%;object-fit:cover;display:block}
.ev .evc b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:400}
.ev .evt2{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.ev .evt2 strong{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.ev .evt2 span{font-size:12px;color:var(--ink-2)}
.ev.add{align-items:center;justify-content:center;gap:6px;min-height:150px;border-style:dashed;color:var(--accent);font-weight:700;font-size:14px;background:transparent}
.ev.add .plus{font-size:30px;line-height:1}
.evform{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.evform input[type=text]{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.evform .emo{margin-top:10px}
.evform .row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}

/* Galeri masonry */
.masonry{column-count:2;column-gap:8px;margin-top:14px}
@media (min-width:520px){.masonry{column-count:3}}
.mi{position:relative;display:block;width:100%;margin:0 0 12px;padding:6px 6px 8px;border:0;break-inside:avoid;border-radius:4px;background:#FFFDF8;color:#3A332A;box-shadow:0 2px 3px rgba(60,40,10,.18),0 10px 20px -12px rgba(60,40,10,.5);transform:rotate(-.9deg)}
.mi:nth-child(even){transform:rotate(.9deg)}
.mi:nth-child(3n){transform:rotate(.3deg)}
.mi img{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:2px}
.mi .cap{display:block;padding:7px 2px 0;font:italic 500 13px/1.3 var(--font-display);text-align:left;color:#3A332A;overflow-wrap:anywhere}

/* Garis masa */
.tl{list-style:none;margin:20px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:2px;background:repeating-linear-gradient(to bottom,var(--gold) 0 6px,transparent 6px 12px);opacity:.7}
.tl-i{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;padding-bottom:24px}
.tl-m{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--gold);font-size:21px;box-shadow:var(--shadow)}
.tl-c{min-width:0;padding-top:2px}
.tl-d{font:700 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.tl-p{margin:2px 0 6px;font:700 19px/1.25 var(--font-display);overflow-wrap:anywhere}
.tl-x{margin:0 0 10px;font:400 15px/1.6 var(--font-serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-ph{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tl-ph button{flex:none;width:92px;height:92px;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.tl-ph img{width:100%;height:100%;object-fit:cover;display:block}

/* Suapan */
.feed{display:flex;flex-direction:column;gap:20px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 14px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.who strong{font-weight:700;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--ink-2)}
.eg{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--coral);border:1px solid var(--coral);border-radius:99px;padding:2px 10px;margin-right:6px}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:none;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--coral-soft);font-size:14px;font-weight:600}
.confirm span{flex:1 1 180px}
.photos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.pic{position:relative;display:block;padding:0;border:0;background:var(--surface-2);overflow:hidden;min-width:0}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic.big{grid-column:span 6;aspect-ratio:4/3}
.photos.one .pic.big{aspect-ratio:auto}
.photos.one .pic img{height:auto;max-height:80vh}
.pic.r1{grid-column:span 6;aspect-ratio:16/9}
.pic.r2{grid-column:span 3;aspect-ratio:1}
.pic.r3{grid-column:span 2;aspect-ratio:1}
.pic .more{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);color:#fff;font:700 26px var(--font-display)}
.pic.gone img,.mi.gone img{visibility:hidden}
.film{position:absolute;right:12px;bottom:10px;font:400 14px 'Share Tech Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#FFB224;text-shadow:0 0 6px rgba(255,120,0,.75),0 1px 1px rgba(0,0,0,.55);pointer-events:none}
.body{display:flex;flex-direction:column;gap:12px;padding:16px 16px 6px}
.story{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch;font:400 17px/1.7 var(--font-serif)}
.stamp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.stamp .pl{display:inline-flex;align-items:center;gap:6px;min-width:0;font:700 12px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.stamp .pl .i{width:16px;height:16px;stroke:var(--coral)}
.stamp .pl span{overflow-wrap:anywhere}
.stamp .dt{font:italic 500 16px/1.3 var(--font-display);color:var(--ink-2)}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 12px 3px 8px;border-radius:99px;background:var(--teal-soft);color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:2px;padding:4px 8px 8px}
.act{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--ink-2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:440px){.acts{gap:0;padding:4px 4px 8px}.act{padding:0 9px;gap:5px}}
.act:hover{background:var(--surface-2)}
.act.liked{color:var(--heart)}
.act.liked .i{fill:var(--heart);stroke:var(--heart)}
.nota{margin:0 14px 14px;padding:12px 14px 12px;border-radius:6px 6px 14px 6px;background:var(--sticky);color:var(--sticky-ink);transform:rotate(-.5deg);box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.nota-h{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.nota-h .i{width:14px;height:14px}
.nota p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:italic 500 17px/1.5 var(--font-serif)}
.nota textarea{width:100%;min-height:80px;padding:8px 10px;border:1px dashed rgba(61,48,0,.4);border-radius:8px;background:rgba(255,255,255,.5);color:var(--sticky-ink);font:italic 500 16px/1.5 var(--font-serif);resize:vertical}
.nota-a{display:flex;gap:8px}
.nota .lnk{align-self:flex-start;color:var(--sticky-ink)}
.cms{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
.cm{display:flex;gap:10px;min-width:0}
.cm-b{min-width:0;flex:1}
.cm-b p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;font:400 15px/1.55 var(--font-serif)}
.cm-x{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--ink-2);opacity:.75}
.cm-q{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-2)}
.rxs{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:2px 16px 16px}
.rx{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.rx[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rx.more{color:var(--ink-2)}
.rx b{font-weight:700;font-size:13px}
.with{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.tagpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tl-y{list-style:none;margin:6px 0 14px;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.tl-y h2{margin:0;font-family:var(--font-display,inherit);font-size:24px;color:var(--ink)}
.tl-y span{font-size:13px;color:var(--ink-2);margin-left:8px}
.lb-stage{touch-action:none}
.lb-stage img{transition:none;will-change:transform}
.cm-b .t{font-size:12px;color:var(--ink-2);margin-left:6px}
.cm-form{display:flex;gap:8px}
.cm-form input{flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

/* Butang */
.btn{min-height:48px;padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* Kosong, contoh, notis */
.demo-b{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:14px;padding:16px 18px;border-radius:20px;background:var(--coral-soft);border:1px solid var(--coral)}
.demo-b strong{font:700 18px/1.25 var(--font-display)}
.demo-b p{margin:0;font:400 15px/1.55 var(--font-serif)}
.empty{margin-top:24px;padding:26px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{margin:0;font:700 21px/1.2 var(--font-display);text-wrap:balance}
.empty p{margin:0;color:var(--ink-2);max-width:42ch;font:400 16px/1.6 var(--font-serif)}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tip p{margin:0;flex:1;min-width:0}
.note{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.skel{height:300px;border-radius:20px;background:var(--surface-2);margin-top:16px}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes zin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* Navigasi */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:14px;background:none;color:var(--ink-2);font-size:12px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;z-index:36;bottom:calc(80px + env(safe-area-inset-bottom,0px));right:max(max(16px,env(safe-area-inset-right,0px)),calc(50vw - 320px));display:flex;align-items:center;gap:8px;min-height:52px;padding:0 22px 0 16px;border:0;border-radius:99px;background:var(--gold);color:#2B1A06;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(60,40,0,.32)}

/* Borang */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:94%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{margin:0;font:700 22px/1.2 var(--font-display)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:90px;font-family:var(--font-serif)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:2px dashed var(--gold);border-radius:14px;background:var(--bg);font-weight:600}
.pick:disabled{opacity:.55;cursor:default}
.prev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.prev:empty{display:none}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;right:4px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--scrim);color:#fff}
.th button .i{width:16px;height:16px}
.emo{display:flex;flex-wrap:wrap;gap:8px}
.emo button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:23px;line-height:1}
.emo button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 2px var(--teal)}
.status{margin:0;min-height:1.4em;font-size:14px;font-weight:600}
.status.err{color:var(--heart)}

/* Paparan gambar */
.lb{position:fixed;inset:0;z-index:60;background:var(--lb-bg);color:var(--lb-ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.lb-btn{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:var(--lb-ink)}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb::before{content:"";position:absolute;inset:-40px;background:var(--lbbg,none) center/cover;filter:blur(36px) brightness(.45) saturate(1.3);z-index:0}
.lb>*{position:relative;z-index:1}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;border:8px solid #FFFDF8;border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.lb-stage .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb-stage .nav.l{left:0}
.lb-stage .nav.r{right:0}
.lb-cap{max-height:24%;overflow-y:auto;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px)}
.lb-cap:empty{display:none}
.lb-cap .cp{font:italic 500 19px var(--font-display)}
.lb-cap p{margin:4px 0 0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);z-index:90;max-width:min(92vw,420px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;text-align:center}

/* Gerak halus */
@media (prefers-reduced-motion:no-preference){
  .btn,.chip,.act,.icon-btn,.tab{transition:background-color .15s,opacity .15s}
  .acard,.mem,.mi,.pgrid button,.place,.tl-ph button{transition:transform .22s ease,box-shadow .22s ease}
  .lb:not([hidden]) .lb-stage img.zin{animation:zin .3s ease-out}
  .act.likepop .i{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
}
@media (hover:hover){
  .mi:hover{transform:rotate(0) scale(1.05)}

const SKINS=[['kampung','Kampung','linear-gradient(135deg,#3F8A7C,#E2A93B)'],['pantai','Pantai','linear-gradient(135deg,#1E8FB0,#FF8A6B)'],['raya','Raya','linear-gradient(135deg,#1F6F4A,#C9962B)'],['senja','Senja','linear-gradient(135deg,#7B5EA7,#F0A64B)']];
const BIGL=['Biasa','Besar','Lebih besar'];
function applyBig(n){
  S.big=n>=0&&n<=2?n:0;
  if(S.big)document.documentElement.setAttribute('data-big',String(S.big));else document.documentElement.removeAttribute('data-big');
  try{localStorage.setItem('kk-big',String(S.big));}catch(e){}
}
function renderSet(){
  const sk=$('set-skins'); if(!sk)return;
  sk.innerHTML=SKINS.map(x=>'<button type="button" class="tile" data-act="skin" data-v="'+x[0]+'" aria-pressed="'+(S.skin===x[0])+'"><i style="background:'+x[2]+'"></i>'+esc(x[1])+'</button>').join('');
  $('set-big').innerHTML=BIGL.map((l,i)=>'<button type="button" data-act="big" data-v="'+i+'" aria-pressed="'+(S.big===i)+'">'+l+'</button>').join('');
  $('set-me').innerHTML=(S.myId?av(S.myId):'')+'<div class="nm"><strong>'+esc(S.myId?nameOf(S.myId):'Tetamu')+'</strong><span>'+(S.isOwner?'Pentadbir':'Ahli keluarga')+'</span></div>'+(window.__signOut?'<button type="button" class="btn sm ghost" data-act="signout">Log keluar</button>':'');
  const city=(S.live&&S.live.city)||S.cityName||S.city||'';
  $('set-loc').textContent=S.gpsOn?'Mengikut lokasi anda'+(city?': '+city:'')+'.':'Bandar dipilih'+(city?': '+city:'')+'.';
  $('set-admin').hidden=!S.isOwner;
}
function openSet(){
  S.setPrev=document.activeElement; renderSet();
  $('set').hidden=false; document.body.style.overflow='hidden';
  const c=$('set').querySelector('.icon-btn'); if(c)try{c.focus({preventScroll:true});}catch(e){}
}
function closeSet(){
  $('set').hidden=true; $('cityf').hidden=true;
  if($('lb').hidden&&$('sheet').hidden)document.body.style.overflow='';
  if(S.setPrev&&S.setPrev.focus)try{S.setPrev.focus({preventScroll:true});}catch(e){}
}
function applySkin(k){
  const r=document.documentElement;
  if(k==='kampung'||!SKINS.some(x=>x[0]===k))r.removeAttribute('data-skin'); else r.setAttribute('data-skin',k);
  S.skin=SKINS.some(x=>x[0]===k)?k:'kampung';
  if(typeof renderSet==='function')renderSet();
}
const VIEWS=['utama','galeri','peta'];

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const str=v=>typeof v==='string'?v:'';
const num=v=>typeof v==='number'&&isFinite(v)?v:0;
const isId=s=>typeof s==='string'&&/^([0-9a-f]{32}|d_[0-9a-z]{12,24})$/i.test(s);
const icon=n=>'<svg class="i" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';
const pk=s=>str(s).trim().toLowerCase();
const mapUrl=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p);
const pad=n=>String(n).padStart(2,'0');

const S={
  posts:[],likes:[],comments:[],notes:{},
  ready:false,slow:false,err:'',noDb:false,
  tab:'utama',cat:'semua',place:'',gmode:'grid',asc:false,sort:'tambah',pin:'',
  open:new Set(),noteOpen:new Set(),drafts:{},confirmDel:'',busy:new Set(),
  db:null,user:null,assets:null,myId:'',isOwner:false,canEdit:false,canWrite:null,
  albums:[],albumsOk:false,album:'',alOpen:false,alName:'',alEmoji:'🎉',alDel:false,seenBase:0,seenSet:false,onlyNew:false,gpsOn:true,gpsAt:0,q:'',sOpen:false,cmDel:'',big:0,members:[],rxOpen:'',locSet:'',locQ:'',tipGone:false,popKey:'',wx:'cerah',live:null,skin:'kampung',memN:0,city:'Kuala Lumpur',lk:'',wxMsg:'',mcp:null
};
let PS={}, P=[], DEMO=false, GL=[], PL=[];
let renderTok=0, toastTimer=0;

/* ---------- gambar: aset, simpanan db, contoh ---------- */
const IMG=new Map(), IMGWAIT=new Set(), RATIO=new Map(), TINT=new Map(), TINTWAIT=new Set();
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const SCN={
  ex_sunset:{s:['#F9B572','#D7455B'],sun:'#FFE3A3',sx:290,sy:130,sr:42,h:['#8A2D4B','#5A1633','#34091F'],w:400,hh:520},
  ex_hills:{s:['#BFE3D8','#4E9C8E'],sun:'#FFF6D6',sx:110,sy:80,sr:30,h:['#2F7F6B','#1F5C50','#123C36'],w:400,hh:300},
  ex_beach:{s:['#9FD3F0','#E9F6FB'],sun:'#FFF1B8',sx:310,sy:70,sr:32,h:['#2D8FB5','#F0D9A8','#D9BD84'],w:400,hh:400},
  ex_dusk:{s:['#6B5B95','#F4A7A0'],sun:'#FFD9A6',sx:200,sy:150,sr:36,h:['#4B3B72','#33264F','#1F1535'],w:400,hh:330},
  ex_river:{s:['#F7D9A0','#7FB7BE'],sun:'#FFF3CF',sx:80,sy:110,sr:34,h:['#3E8E8A','#2A6A6E','#184A52'],w:400,hh:480},
  ex_food:{s:['#F6C177','#C8553D'],sun:'#FFEBC2',sx:300,sy:90,sr:36,h:['#A63D2F','#7A2A22','#4D1914'],w:400,hh:360}
};
function scene(k){
  const c=SCN[k]||SCN.ex_hills;
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='"+c.w+"' height='"+c.hh+"' viewBox='0 0 400 300' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='"+c.s[0]+"'/><stop offset='1' stop-color='"+c.s[1]+"'/></linearGradient></defs><rect width='400' height='300' fill='url(#g)'/><circle cx='"+c.sx+"' cy='"+c.sy+"' r='"+c.sr+"' fill='"+c.sun+"'/><path d='M0 205Q100 150 200 192T400 172V300H0Z' fill='"+c.h[0]+"'/><path d='M0 238Q120 192 230 226T400 214V300H0Z' fill='"+c.h[1]+"'/><path d='M0 268Q150 236 280 258T400 250V300H0Z' fill='"+c.h[2]+"'/></svg>";
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
function srcOf(id){
  if(id.slice(0,3)==='ex_')return scene(id);
  if(id.slice(0,2)==='d_')return IMG.get(id)||'';
  return '/_blob/'+id;
}
function isrc(id){
  if(id.slice(0,3)==='ex_')return ' src="'+scene(id)+'"';
  if(id.slice(0,2)!=='d_')return ' src="/_blob/'+id+'"';
  if(!IMG.has(id))loadImg(id);
  return ' src="'+(IMG.get(id)||BLANK)+'" data-iid="'+id+'"';
}
const FULL=new Map();
let IDB=null;
function idb(){
  if(IDB)return IDB;
  IDB=new Promise(res=>{try{const r=indexedDB.open('kk-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});

function computeTint(id){
  if(!id||TINT.has(id)||TINTWAIT.has(id))return;

      const x=c.getContext('2d'); x.drawImage(im,0,0,16,16);
      const d=x.getImageData(0,0,16,16).data; let r=0,g=0,b=0,w=0;
      for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const s=(mx-mn)/255+.05;r+=d[i]*s;g+=d[i+1]*s;b+=d[i+2]*s;w+=s;}
      const col='rgb('+Math.round(r/w)+','+Math.round(g/w)+','+Math.round(b/w)+')';
      TINT.set(id,col);
      document.querySelectorAll('[data-tint="'+id+'"]').forEach(el=>el.style.setProperty('--tint',col));
    }catch(e){}

}

function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function fmtDate(s){if(!validDate(s))return '';const p=s.split('-').map(Number);return p[2]+' '+(BULAN[p[1]-1]||'')+' '+p[0];}
function fmtMonth(s){if(!validDate(s))return '';const p=s.split('-').map(Number);return (BULAN[p[1]-1]||'')+' '+p[0];}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateOf(p){return p.takenOn||(p.createdAt?ymd(new Date(p.createdAt)):'');}

function greet(){const h=new Date().getHours();return h<11?'Selamat pagi':h<14?'Selamat tengah hari':h<19?'Selamat petang':'Selamat malam';}
function ago(ts){
  if(!ts)return '';
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60)return 'baru sebentar tadi';
  const m=Math.floor(s/60); if(m<60)return m+' minit lalu';
  const h=Math.floor(m/60); if(h<24)return h+' jam lalu';
  const d=Math.floor(h/24); if(d<7)return d+' hari lalu';
  if(d<30)return Math.floor(d/7)+' minggu lalu';
  const dt=new Date(ts); return dt.getDate()+' '+BULAN[dt.getMonth()]+' '+dt.getFullYear();
}

async function geoLookup(){
  if(geoBusy)return;
  const todo=[]; P.forEach(p=>{const k=pk(p.place);if(k&&!p.demo&&!(p.lat!=null&&p.lon!=null)&&!geo(p.place)&&!(k in GEO)&&!GTRY.has(k)&&!todo.some(t=>t[0]===k))todo.push([k,p.place]);});
  if(!todo.length)return;
  geoBusy=true; let changed=false;
  for(const t of todo.slice(0,3)){
    GTRY.add(t[0]);
    const g=await findPlace(t[1],6);
    if(g){GEO[t[0]]=g;changed=true;}
  }
  if(changed){try{localStorage.setItem('kk-geo',JSON.stringify(GEO));}catch(e){} }
  geoBusy=false; if(changed)render();
}
async function savePostLoc(p,lat,lon){
  await S.db.doc('posts/'+p.id).set({authorId:p.authorId,text:p.text,place:p.place,takenOn:p.takenOn,cat:p.cat,emoji:p.emoji,photos:p.photos,album:p.album,tags:p.tags,createdAt:p.createdAt,lat:lat,lon:lon});
}
async function applyLoc(key,lat,lon){
  GEO[key]=[lat,lon]; try{localStorage.setItem('kk-geo',JSON.stringify(GEO));}catch(e){}
  const all=S.posts.filter(p=>pk(p.place)===key), mine=all.filter(p=>p.authorId===S.myId);
  let ok=0; for(const p of mine){try{await savePostLoc(p,lat,lon);ok++;}catch(e){}}
  S.locSet=''; render();
  toast(mine.length===all.length?'Lokasi disimpan untuk semua ahli keluarga.':'Lokasi disimpan. Kenangan orang lain hanya nampak pin ini pada phone awak.');
}
function mapData(){
  const pins=new Map(), off=new Map();
  P.forEach(p=>{
    if(!p.place)return;
    const g=(p.lat!=null&&p.lon!=null&&MYB(p.lat,p.lon))?[pk(p.place),p.lat,p.lon]:geo(p.place);
    if(!g){const k=pk(p.place);if(!off.has(k))off.set(k,{name:p.place,n:0});off.get(k).n++;return;}
    const key=g[1]+','+g[2]; let e=pins.get(key);
    if(!e){e={key:key,lat:g[1],lng:g[2],posts:[],names:new Set()};pins.set(key,e);}
    e.posts.push(p); e.names.add(p.place);
  });
  return {pins:Array.from(pins.values()).sort((a,b)=>b.lat-a.lat),off:Array.from(off.values())};
}
const VBW=480,VBH=204;
function mapSvg(md){
  let h='<svg class="mapsvg" viewBox="0 0 '+VBW+' '+VBH+'" role="img" aria-label="Peta ringkas Malaysia dengan pin tempat kenangan"><path class="land" d="'+poly(PEN)+'"/><path class="land" d="'+poly(BOR)+'"/><text class="mlabel" x="66" y="200">Semenanjung</text><text class="mlabel" x="335" y="200">Sabah dan Sarawak</text>';
  const ord=md.pins.slice().sort((a,b)=>minDate(a).localeCompare(minDate(b)));
  if(ord.length>1){
    let d='M'+mx(ord[0].lng).toFixed(1)+' '+my(ord[0].lat).toFixed(1);
    for(let i=1;i<ord.length;i++){
      const x1=mx(ord[i-1].lng),y1=my(ord[i-1].lat),x2=mx(ord[i].lng),y2=my(ord[i].lat);
      const cx=(x1+x2)/2-(y2-y1)*0.25, cy=(y1+y2)/2+(x2-x1)*0.25;
      d+=' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1);
    }
    h+='<path class="route" d="'+d+'"/>';
  }
  md.pins.forEach(pn=>{
    const x=mx(pn.lng).toFixed(1), y=my(pn.lat).toFixed(1), n=pn.posts.length;
    h+='<g class="pin'+(S.pin===pn.key?' on':'')+'" data-act="pin" data-v="'+pn.key+'" role="button" tabindex="0" aria-label="'+esc(Array.from(pn.names).join(', '))+', '+n+' kenangan"><circle class="hit" cx="'+x+'" cy="'+y+'" r="16"/><circle class="pulse" cx="'+x+'" cy="'+y+'" r="8"/><circle class="ring" cx="'+x+'" cy="'+y+'" r="12"/><circle class="dot" cx="'+x+'" cy="'+y+'" r="'+(n>1?8:6)+'"/>'+(n>1?'<text x="'+x+'" y="'+(+y+3)+'">'+n+'</text>':'')+'</g>';
  });
  return h+'</svg>';
}
function minDate(pn){return pn.posts.reduce((m,p)=>{const d=dateOf(p)||'9999';return d<m?d:m;},'9999');}
function popHtml(md){
  const pn=md.pins.find(x=>x.key===S.pin); if(!pn)return '';
  const first=pn.posts.find(p=>p.photos.length), th=first?first.photos[0]:'';
  const x=mx(pn.lng)/VBW*100, y=my(pn.lat)/VBH*100, left=Math.min(64,Math.max(36,x));
  const below=y<38;
  const n=pn.posts.length;
  return '<div class="pop" style="left:'+left.toFixed(1)+'%;top:'+y.toFixed(1)+'%;transform:translate(-50%,'+(below?'18px':'calc(-100% - 16px)')+')">'+(th?'<img'+isrc(th)+' alt="">':'')+'<div><b>'+esc(Array.from(pn.names)[0])+'</b><span>'+n+' kenangan</span></div></div>';
}

function dayOfYear(){const n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);}
function memoryHtml(){
  const now=new Date(), md=pad(now.getMonth()+1)+'-'+pad(now.getDate()), yr=now.getFullYear(), doy=dayOfYear();
  const withPh=P.filter(p=>p.photos.length); if(!withPh.length)return '';
  const past=withPh.filter(p=>p.takenOn&&p.takenOn.slice(5)===md&&+p.takenOn.slice(0,4)<yr);
  let p,label;
  const sh=S.memN;
  if(past.length&&!sh){p=past[0];label='Pada hari ini, '+(yr-(+p.takenOn.slice(0,4)))+' tahun lalu';}
  else{p=withPh[(doy+sh)%withPh.length];label=sh?'Kenangan pilihan':'Kenangan hari ini';}
  if(DEMO)label='Contoh · '+label;
  const idx=(doy+sh)%p.photos.length, pid=p.photos[idx];
  const meta=[p.place,p.takenOn?fmtDate(p.takenOn):''].filter(Boolean).join(' · ');
  return '<div class="memw"><button type="button" class="shuf" data-act="shuf" aria-label="Papar kenangan lain">'+icon('shuffle')+'Lain</button><button type="button" class="mem" data-act="photo" data-id="'+esc(p.id)+'" data-idx="'+idx+'" aria-label="Buka kenangan hari ini"><img'+isrc(pid)+' alt="" decoding="async"><span class="mem-t"><span class="mem-k">'+esc(label)+'</span><span class="mem-q">'+esc(QUOTES[(doy+sh)%QUOTES.length])+'</span>'+(meta?'<span class="mem-m">'+icon('pin')+esc(meta)+'</span>':'')+'</span></button></div>';
}

function wxFrom(code,phrase){
  const c=+code, p=String(phrase||'');
  if((c>=12&&c<=18)||c===26||c===29||(c>=39&&c<=42)||/rain|shower|storm|drizzle/i.test(p))return 'hujan';
  if(c===6||c===7||c===8||c===11||(c>=35&&c<=38)||(c>=19&&c<=25)||c===43||c===44||/cloud|overcast|fog|haz|snow/i.test(p)&&!/partly sunny|mostly sunny|partly cloudy/i.test(p))return 'mendung';

const AW='AccuWeather®';
async function tryGps(manual){
  if(!navigator.geolocation){if(manual)toast('Phone ini tidak menyokong GPS.');return false;}
  const pos=await new Promise(res=>{try{navigator.geolocation.getCurrentPosition(res,res,{enableHighAccuracy:false,timeout:10000,maximumAge:300000});}catch(e){res(e);}});
  if(!pos||!pos.coords){
    if(pos&&pos.code===1){S.gpsOn=false;try{localStorage.setItem('kk-gps','0');}catch(e){}toast('Lokasi tidak dibenarkan. Guna bandar yang dipilih.');}
    else if(manual)toast('Lokasi tidak dapat dikesan. Cuba lagi.');
    return false;
  }
  const key=pos.coords.latitude.toFixed(3)+','+pos.coords.longitude.toFixed(3);
  if(key!==S.lk||!S.cityName){
    let name='';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=ms&lat='+pos.coords.latitude+'&lon='+pos.coords.longitude);
      if(r.ok){const a=(await r.json()).address||{};name=a.suburb||a.neighbourhood||a.city_district||a.village||a.town||a.city||a.county||'';}
    }catch(e){}
    S.cityName=String(name||'Lokasi anda').slice(0,40);
  }
  S.lk=key; S.gpsAt=Date.now();
  try{localStorage.setItem('kk-lk',S.lk);localStorage.setItem('kk-cityname',S.cityName);}catch(e){}
  return true;
}

async function loadWx(force){
  const m=S.mcp; if(!m)return;
  try{
    if(!S.lk||force){
      const r=await m.callTool(AW,'widgets-search-claude',{queryParams:{query:S.city}},{cache:{staleTime:6048e5,gcTime:6048e5}});
      const hit=r&&r.payload&&Array.isArray(r.payload.results)?r.payload.results[0]:null;
      if(!hit||!hit.locationKey){S.wxMsg='Bandar tidak dijumpai.';toast('Bandar "'+S.city+'" tidak dijumpai.');return false;}
      S.lk=String(hit.locationKey); S.cityName=String(hit.name||S.city).split(',')[0];
      try{localStorage.setItem('kk-lk',S.lk);localStorage.setItem('kk-cityname',S.cityName);}catch(e){}
    }
    const c=await m.callTool(AW,'widgets-current-claude',{queryParams:{locationKey:S.lk,unit:'metric',lang:'en'}},{cache:{staleTime:6e5,gcTime:36e5}});
    const cc=c&&c.payload&&c.payload.currentConditions;
    if(!cc)throw {code:'bad_shape'};
    S.live={wx:wxFrom(cc.iconCode,cc.phrase),isDay:cc.isDayTime!==false,temp:Math.round(num(cc.temperatureValue)),phrase:str(cc.phrase),city:S.cityName||S.city};
    paintSky(); return true;
  }catch(e){
    S.live=null; S.wxMsg='Cuaca langsung tidak tersedia ('+((e&&e.code)||'ralat')+'). Guna pilihan manual.';
    paintSky(); return false;
  }
}
async function doImport(file){
  if(!canAct()||!S.myId)return;
  let d;
  try{d=JSON.parse(await file.text());}catch(e){toast('Fail import tidak sah.');return;}
  if(!d||d.kind!=='kenangan-export'||!Array.isArray(d.posts)){toast('Fail ini bukan eksport kenangan.');return;}
  const imgs=d.imgs&&typeof d.imgs==='object'?Object.keys(d.imgs):[], posts=d.posts, cms=Array.isArray(d.comments)?d.comments:[];
  const total=imgs.length+posts.length+cms.length; let n=0;
  const step=()=>{n++;toast('Mengimport '+n+' / '+total+'…');};
  try{
    for(const id of imgs){
      const u=d.imgs[id]; if(!isId(id)||id.slice(0,2)!=='d_'||typeof u!=='string'||u.indexOf('data:image/')!==0)continue;
      await S.db.doc('imgs/'+id).set({data:u,by:S.myId,createdAt:Date.now()}); step();
    }
    for(const a of (Array.isArray(d.albums)?d.albums:[])){
      if(!a||!/^[A-Za-z0-9]{8,40}$/.test(String(a.id)))continue;
      const x=normAlbum(String(a.id),a); if(!x.name)continue;
      await S.db.doc('albums/'+x.id).set({name:x.name,emoji:x.emoji,createdBy:S.myId,createdAt:x.createdAt||Date.now()});
    }
    for(const p of posts){
      if(!p||!/^[A-Za-z0-9]{8,40}$/.test(String(p.id)))continue;
      const x=normPost(String(p.id),p);
      await S.db.doc('posts/'+x.id).set({authorId:S.myId,text:x.text,place:x.place,takenOn:x.takenOn,cat:x.cat,emoji:x.emoji,photos:x.photos,album:x.album,tags:x.tags,lat:x.lat,lon:x.lon,createdAt:x.createdAt||Date.now()}); step();
    }
    for(const c of cms){
      if(!c||!/^[A-Za-z0-9]{8,40}$/.test(String(c.id)))continue;
      const x=normComment(String(c.id),c);
      await S.db.doc('comments/'+x.id).set({postId:x.postId,authorId:S.myId,text:x.text,createdAt:x.createdAt||Date.now()}); step();
    }
    toast('Siap. '+posts.length+' kenangan diimport.');
    S.cat='semua';S.place='';go('utama');
  }catch(e){toast('Import terhenti di '+n+' / '+total+'. Cuba lagi, data yang dah masuk tak akan berganda.');}
}

function exifDate(v,t){
  const le=v.getUint16(t)===0x4949;
  const u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
  const find=(ifd,tag)=>{const n=u16(ifd);for(let i=0;i<n&&i<200;i++){const e=ifd+2+i*12;if(u16(e)===tag)return e;}return 0;};

  const ex=find(ifd0,0x8769);
  if(ex){const ifd=t+u32(ex+8);e=find(ifd,0x9003)||find(ifd,0x9004);}
  if(!e)e=find(ifd0,0x0132);

  for(let i=0;i<19;i++)str+=String.fromCharCode(v.getUint8(o+i));
  const m=/^(\d{4}):(\d\d):(\d\d)/.exec(str);
  return m&&m[1]!=='0000'?m[1]+'-'+m[2]+'-'+m[3]:'';
}

      await S.db.doc('posts/'+F.edit).set(Object.assign({authorId:old.authorId,createdAt:old.createdAt},fields));
      old.photos.filter(x=>x.slice(0,2)==='d_'&&ids.indexOf(x)<0).forEach(x=>{S.db.doc('imgs/'+x).delete().catch(()=>{});S.db.doc('thumbs/'+x).delete().catch(()=>{});});
      F.busy=false;$('submit').disabled=false;setStatus('');
      resetForm();closeSheet();toast('Perubahan disimpan.');
      return;
    }
    await S.db.collection('posts').add(Object.assign({authorId:S.myId,createdAt:Date.now()},fields));
    F.files.forEach(f=>URL.revokeObjectURL(f.url)); F.files=[]; F.emoji=''; renderPreviews();
    $('f-story').value='';$('f-place').value='';$('f-date').value='';
    F.busy=false; $('submit').disabled=false; setStatus('');
    closeSheet(); toast('Kenangan dikongsi dengan keluarga.');
    S.cat='semua';S.place='';S.album='';
    if(location.hash!=='#utama')location.hash='#utama'; else render();
    window.scrollTo(0,0);
  }catch(e){
    setStatus(upErr(e),true);
  }finally{
    F.busy=false;$('submit').disabled=false;
  }
}

async function backupAll(){
  if(!S.isOwner||!S.posts.length){toast('Tiada kenangan untuk disandarkan.');return;}
  const ids=Array.from(new Set(S.posts.flatMap(p=>p.photos.filter(x=>x.slice(0,2)==='d_'))));
  const out={kind:'kenangan-export',v:2,exportedAt:new Date().toISOString(),
    posts:S.posts.map(p=>({id:p.id,authorId:p.authorId,authorName:nameOf(p.authorId),text:p.text,place:p.place,takenOn:p.takenOn,cat:p.cat,emoji:p.emoji,photos:p.photos,album:p.album,tags:p.tags,lat:p.lat,lon:p.lon,createdAt:p.createdAt})),
    comments:S.comments.map(c=>({id:c.id,postId:c.postId,authorId:c.authorId,authorName:nameOf(c.authorId),text:c.text,createdAt:c.createdAt})),
    albums:S.albums.map(a=>({id:a.id,name:a.name,emoji:a.emoji,createdAt:a.createdAt})),imgs:{}};
  let n=0,miss=0;
  for(const id of ids){
    toast('Menyandarkan gambar '+(++n)+' / '+ids.length+'…');
    const u=await fullData(id); if(u&&u.indexOf('data:image/')===0)out.imgs[id]=u; else miss++;
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const name='kenangan-sandaran-'+ymd(new Date())+'.json';
  const file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('Sandaran siap.'+(miss?' '+miss+' gambar tak dapat dimuat.':''));return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  toast('Sandaran disimpan ('+Math.round(blob.size/1048576*10)/10+' MB).'+(miss?' '+miss+' gambar tak dapat dimuat.':''));
}
async function inviteMember(){

  const url=location.origin+location.pathname+'?k='+encodeURIComponent(code);
  const text='Jom sertai album keluarga kita! Buka pautan ini, log masuk dengan Google, dan awak terus masuk.';
  try{if(navigator.share){await navigator.share({title:'Kenangan Keluarga Ahmad',text:text,url:url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text+'\n'+url);toast('Pautan jemputan disalin. Tampal dalam WhatsApp.');}
  catch(e){window.prompt('Salin pautan ini dan hantar kepada ahli keluarga:',url);}
}

const Z={s:1,x:0,y:0,d:0,s0:1,px:0,py:0,sx:0,sy:0,t:0,pinch:false,moved:false};
function zApply(){const li=$('lb-img');li.style.transform=Z.s===1?'':'translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';}
function zReset(){Z.s=1;Z.x=0;Z.y=0;Z.pinch=false;zApply();}
function zClamp(){const li=$('lb-img');const mx=(Z.s-1)*li.offsetWidth/2+30,my=(Z.s-1)*li.offsetHeight/2+30;Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));}
function zDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
function zToggle(cx,cy){
  if(Z.s>1){zReset();return;}
  const r=$('lb-img').getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height/2;
  Z.s=2.5;Z.x=(ox-cx)*1.5;Z.y=(oy-cy)*1.5;zClamp();zApply();
}
$('lb-stage').addEventListener('touchstart',e=>{
  const t=e.touches;
  if(t.length===2){Z.pinch=true;Z.d=zDist(t);Z.s0=Z.s;return;}
  Z.moved=false;Z.sx=t[0].clientX;Z.sy=t[0].clientY;Z.px=Z.x;Z.py=Z.y;LB.x=t[0].clientX;
},{passive:true});
$('lb-stage').addEventListener('touchmove',e=>{
  const t=e.touches;
  if(t.length===2&&Z.pinch){e.preventDefault();Z.s=Math.max(1,Math.min(5,Z.s0*zDist(t)/Z.d));if(Z.s===1){Z.x=0;Z.y=0;}else zClamp();zApply();return;}
  if(t.length===1&&Z.s>1&&!Z.pinch){e.preventDefault();Z.moved=true;Z.x=Z.px+(t[0].clientX-Z.sx);Z.y=Z.py+(t[0].clientY-Z.sy);zClamp();zApply();}
},{passive:false});
$('lb-stage').addEventListener('touchend',e=>{
  if(e.touches.length>0)return;
  if(Z.pinch){Z.pinch=false;if(Z.s<1.05)zReset();return;}
  if(e.target.closest&&e.target.closest('.nav'))return;
  const c=e.changedTouches[0], dx=c.clientX-LB.x, dy=c.clientY-Z.sy;
  if(Z.s>1){
    if(!Z.moved&&Math.abs(dx)<10&&Math.abs(dy)<10){const n=Date.now();if(n-Z.t<320){zToggle(c.clientX,c.clientY);Z.t=0;}else Z.t=n;}
    return;
  }
  if(Math.abs(dx)<10&&Math.abs(dy)<10){const n=Date.now();if(n-Z.t<320){zToggle(c.clientX,c.clientY);Z.t=0;}else Z.t=n;return;}
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))stepLB(dx>0?-1:1);
},{passive:true});
$('lb-stage').addEventListener('dblclick',e=>zToggle(e.clientX,e.clientY));
$('lb-stage').addEventListener('wheel',e=>{e.preventDefault();Z.s=Math.max(1,Math.min(5,Z.s*(e.deltaY<0?1.15:0.87)));if(Z.s===1){Z.x=0;Z.y=0;}else zClamp();zApply();},{passive:false});

async function init(){
  try{S.tipGone=localStorage.getItem('kk-tip')==='1';}catch(e){}
  try{const s=localStorage.getItem('kk-sort');if(s==='tambah'||s==='kenangan')S.sort=s;}catch(e){}
  try{const w=localStorage.getItem('kk-wx');if(WXS.some(x=>x[0]===w))S.wx=w;}catch(e){}
  try{const c=localStorage.getItem('kk-city');if(c)S.city=c.slice(0,60);S.lk=localStorage.getItem('kk-lk')||'';S.cityName=localStorage.getItem('kk-cityname')||'';if(!S.cityName)S.lk='';}catch(e){}
  try{applyBig(parseInt(localStorage.getItem('kk-big')||'0',10)||0);}catch(e){}
  try{applySkin(localStorage.getItem('kk-skin')||'kampung');}catch(e){applySkin('kampung');}
  route();
  let cl=window.claude;
  for(let i=0;i<20&&(!cl||!cl.use);i++){await new Promise(r=>setTimeout(r,150));cl=window.claude;}
  if(!cl||!cl.use){S.noDb=true;S.ready=true;render();return;}
  try{S.gpsOn=localStorage.getItem('kk-gps')!=='0';}catch(e){}
  cl.use('mcp').then(m=>{S.mcp=m;if(m){loadWx();if(S.gpsOn)tryGps(false).then(ok=>{if(ok)loadWx();});setInterval(()=>{if(!document.hidden)refreshWx();},6e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-S.gpsAt>3e5&&S.gpsOn)refreshWx();});}}).catch(()=>{});
  const got=await Promise.all([cl.use('db'),cl.use('user'),cl.use('assets')]);
  S.db=got[0];S.user=got[1];S.assets=got[2];
  if(S.user){
    try{
      const me=await S.user.me();
      S.myId=me.id||'';S.isOwner=!!me.isOwner;S.canEdit=!!me.canEdit;
      S.canWrite=await S.user.can('data.write');
      applySkin(S.skin);
    }catch(e){}
  }
  if(!S.db){S.noDb=true;S.ready=true;render();return;}
  const timer=setTimeout(()=>{S.slow=true;render();},10000);
  const live=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);S.slow=false;}};
  const fail=e=>{S.err=(e&&e.code)||'ralat';S.ready=true;render();};
  S.db.collection('posts').onSnapshot(snap=>{
    S.posts=snap.docs.map(d=>normPost(d.id,d.data()||{}));
    if(!snap.metadata.fromCache||snap.size>0)S.ready=true;
    live(snap);render();
  },fail);
  S.db.collection('likes').onSnapshot(snap=>{S.likes=snap.docs.map(d=>normLike(d.id,d.data()||{}));render();},fail);
  S.db.collection('comments').onSnapshot(snap=>{S.comments=snap.docs.map(d=>normComment(d.id,d.data()||{}));render();},fail);
  S.db.collection('members').onSnapshot(snap=>{
    S.members=snap.docs.map(d=>({id:d.id,name:str((d.data()||{}).name)})).filter(m=>m.name);
    render();
  },()=>{});
  S.db.collection('albums').onSnapshot(snap=>{
    S.albums=snap.docs.map(d=>normAlbum(d.id,d.data()||{})).filter(a=>a.name);
    S.albumsOk=true;
    if(S.album&&!S.albums.some(a=>a.id===S.album))S.album='';
    render();
  },()=>{});
  if(S.myId){
    S.db.collection('data/users/'+S.myId).onSnapshot(snap=>{
      if(!S.seenSet&&!snap.metadata.fromCache){
        S.seenSet=true;
        const sd=snap.docs.find(d=>d.id==='seen'), t=sd?num((sd.data()||{}).t):0;
        S.seenBase=t||Date.now();
        setTimeout(()=>{S.db.collection('data/users/'+S.myId).doc('seen').set({t:Date.now()}).catch(()=>{});},5000);
      }
      const n={}; snap.docs.forEach(d=>{if(d.id.indexOf('note_')===0){const x=d.data()||{};if(str(x.text))n[d.id.slice(5)]=str(x.text).slice(0,600);}});
      S.notes=n;render();
    },()=>{});
  }
}
init();
})();
